# Una entrada por caja de cliente. De aquí salen su túnel (OPNsense), su monitorización (Prometheus),
# lo que ve el cliente en la extranet y, en el laboratorio, su casa simulada. Ver roles/caja/README.md.
#   ip_vpn:          dirección de la caja en la VPN (rango de cajas, red_vpn_cajas). Ansible entra por aquí
#   cliente:         usuario del cliente en la extranet (extranet_clientes)
#   red_casa, ip_casa: red de la casa u oficina del cliente y la IP fija de la caja en ella
#   apps:            apps elegidas por el cliente (catálogo en roles/caja/defaults). AdGuard y la página de inicio van siempre
#   ip_preparacion:  IP mientras se prepara en la sede (VLAN 60, laboratorio de cajas)
#   lab:             solo en el laboratorio: contenedor de prx que hace de mini PC y puente de su casa simulada
all:
  children:
    cajas:
      vars:
        ansible_host: "{{ ip_vpn }}"
        ansible_user: root
        node_exporter_ip: "{{ ip_vpn }}"   # métricas solo por el túnel (también mientras se prepara)
      hosts:
        caja-garcia:
          ip_vpn: 10.99.0.129
          cliente: cliente-a
          red_casa: 192.168.10.0/24
          ip_casa: 192.168.10.2
          apps: [navidrome]
          ip_preparacion: 10.10.60.10
          lab: { vmid: 261, puente_casa: vmbr81 }
        caja-ruiz:
          ip_vpn: 10.99.0.130
          cliente: cliente-b
          red_casa: 192.168.20.0/24
          ip_casa: 192.168.20.2
          apps: [stirling_pdf]
          ip_preparacion: 10.10.60.11
          lab: { vmid: 262, puente_casa: vmbr82 }
