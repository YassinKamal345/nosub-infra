# Datos comunes de la sede.
empresa: NoSub
dominio_interno: nosub.lan

# VLANs de la sede (ver docs/red.md)
vlans:
  - { id: 10, nombre: gestion,     red: 10.10.10.0/24 }
  - { id: 20, nombre: servidores,  red: 10.10.20.0/24 }
  - { id: 30, nombre: dmz,         red: 10.10.30.0/24 }
  - { id: 40, nombre: empleados,   red: 10.10.40.0/24 }
  - { id: 50, nombre: invitados,   red: 10.10.50.0/24 }
  - { id: 60, nombre: lab_cajas,   red: 10.10.60.0/24 }
red_vpn: 10.99.0.0/24

# Contraseñas (el valor real está cifrado en vault.yml)
opnsense_root_clave: "{{ vault_opnsense_root_clave }}"

# Contenedores LXC de la sede (los crea el rol proxmox_vms).
# VMID = 2 + VLAN + número: servidores 220-229, DMZ 230-239 (OPNsense es la 200).
# Las que aún no se usan están comentadas: se activan cuando su rol esté listo.
contenedores:
  - { vmid: 220, nombre: gitea, vlan: 20, ip: 10.10.20.10, nucleos: 2, ram: 1024, disco: 16, descripcion: "Gitea + nodo de control Ansible" }
  - { vmid: 221, nombre: red-int, vlan: 20, ip: 10.10.20.11, descripcion: "Bind9 + Kea DHCP + Squid" }
  - { vmid: 222, nombre: bbdd, vlan: 20, ip: 10.10.20.12, so: rocky, ram: 1024, disco: 16, descripcion: "PostgreSQL" }
  - { vmid: 223, nombre: monitor, vlan: 20, ip: 10.10.20.13, ram: 1024, disco: 16, descripcion: "Prometheus + Grafana" }
  - { vmid: 224, nombre: intranet, vlan: 20, ip: 10.10.20.14, nucleos: 2, ram: 1536, disco: 20, descripcion: "Intranet: Wiki.js + Nextcloud" }
  - { vmid: 230, nombre: extranet, vlan: 30, ip: 10.10.30.10, descripcion: "Extranet (portal de clientes) + Traefik" }

# Máquinas virtuales (las que no pueden ser contenedores; también las crea el rol proxmox_vms).
# Salen de la imagen "cloud" oficial de su distribución y se configuran con cloud-init.
maquinas_virtuales:
  - { vmid: 231, nombre: k3s, vlan: 30, ip: 10.10.30.20, so: ubuntu, nucleos: 2, ram: 3072, disco: 30, descripcion: "k3s: hosting de proyectos DAM/DAW" }
  # GNS3: ensayo de la red física. Se enciende cuando hace falta (no arranca sola con Proxmox).
  # Segunda tarjeta en la VLAN 50 (invitados): hace de "red del centro" de R1 dentro de GNS3 (nodo Cloud)
  - { vmid: 210, nombre: gns3, vlan: 10, ip: 10.10.10.20, so: ubuntu, nucleos: 2, ram: 3072, disco: 30, al_arrancar: false,
      redes_extra: [{ puente: vmbr1, vlan: 50 }], descripcion: "GNS3: ensayo de la red física (routers R1-R3 y SW1)" }

# Solo en el laboratorio (prx): nombres de la página de inicio personal (Caddy en el CT 103, a través
# del puente prx-sede-*). En la centralita se quitan o se cambian por los de Bind9.
opnsense_nombres_web: [opnsense.yk.internal]
gitea_url: http://gitea.yk.internal/
grafana_url: http://grafana.yk.internal/
wiki_nombres_web: [wiki.yk.internal]
nube_nombres_web: [nube.yk.internal]
