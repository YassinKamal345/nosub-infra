# DNS, DHCP y proxy de la sede (CT 221 red-int). Ver roles bind9, kea_dhcp y squid.
ip_red_int: 10.10.20.11

# Nombres fijos de la zona nosub.lan. Los contenedores (lista "contenedores") se añaden solos.
dns_nombres:
  - { nombre: fw,    ip: 10.10.10.1 }    # OPNsense
  - { nombre: prx,   ip: 10.10.10.2 }    # Proxmox
  - { nombre: sw1,   ip: "{{ switches.SW1.ip_gestion }}" }
  - { nombre: sw2,   ip: "{{ switches.SW2.ip_gestion }}" }
  - { nombre: ap,    ip: "{{ punto_acceso.ip_gestion }}" }
# Otros nombres para la misma máquina (alias → nombre real)
dns_alias:
  - { nombre: dns,   destino: red-int }
  - { nombre: dhcp,  destino: red-int }
  - { nombre: proxy, destino: red-int }
  - { nombre: git,   destino: gitea }
  - { nombre: wiki,  destino: intranet }
  - { nombre: nube,  destino: intranet }
  - { nombre: portal, destino: extranet }

# VLANs con DHCP (las de servidores y DMZ usan IPs fijas). Rango: .100 a .199.
# dns: "red-int" = Bind9; "firewall" = el DNS de OPNsense (los invitados no pueden llegar a los servidores).
dhcp_vlans:
  - { vlan: 10, dns: red-int,  horas: 8 }
  - { vlan: 40, dns: red-int,  horas: 8 }
  - { vlan: 50, dns: firewall, horas: 1 }
  - { vlan: 60, dns: red-int,  horas: 8 }

# Redes que pueden usar el proxy (Squid, puerto 3128). Invitados y DMZ no.
proxy_vlans: [10, 20, 40, 60]

# ---------- PostgreSQL (CT 222 bbdd) ----------
ip_bbdd: 10.10.20.12
# Una base por aplicación, con su propio usuario. Contraseña en el Vault: vault_postgresql.<usuario>.
# "desde" = las únicas IPs que pueden conectarse a esa base.
postgresql_bases:
  - { nombre: gitea, usuario: gitea, desde: [10.10.20.10] }
  - { nombre: grafana, usuario: grafana, desde: [10.10.20.13] }
  - { nombre: wikijs, usuario: wikijs, desde: [10.10.20.14] }
  - { nombre: nextcloud, usuario: nextcloud, desde: [10.10.20.14] }
  - { nombre: extranet, usuario: extranet, desde: [10.10.30.10] }    # desde la DMZ: OPNsense solo deja pasar este puerto
# Usuario de solo lectura de estadísticas (rol pg_monitor) para la monitorización
postgresql_monitor: { usuario: prometheus, desde: [10.10.20.13] }

# ---------- Monitorización (CT 223 monitor) ----------
ip_monitor: 10.10.20.13
# Servicios que se comprueban desde fuera (blackbox): si responden como deben
monitor_comprobaciones:
  - { nombre: "Firewall (ping)",   modulo: icmp,        destino: 10.10.10.1 }
  - { nombre: "Firewall (web)",    modulo: https_propio, destino: "https://10.10.10.1" }
  - { nombre: "Gitea (web)",       modulo: http_2xx,    destino: "http://10.10.20.10:3000/api/healthz" }
  - { nombre: "Gitea (git SSH)",   modulo: tcp_connect, destino: "10.10.20.10:2222" }
  - { nombre: "DNS (Bind9)",       modulo: dns_nosub,   destino: "10.10.20.11:53" }
  - { nombre: "Proxy (Squid)",     modulo: tcp_connect, destino: "10.10.20.11:3128" }
  - { nombre: "PostgreSQL",        modulo: tcp_connect, destino: "10.10.20.12:5432" }
  - { nombre: "Grafana (web)",     modulo: http_2xx,    destino: "http://10.10.20.13:3000/api/health" }
  - { nombre: "Wiki (intranet)",   modulo: http_2xx,    destino: "http://10.10.20.14:3000/healthz" }
  - { nombre: "Nextcloud (intranet)", modulo: http_2xx, destino: "http://10.10.20.14/status.php" }
  - { nombre: "Portal de clientes (Traefik HTTPS)", modulo: https_portal, destino: "https://10.10.30.10/salud" }
  - { nombre: "Internet",          modulo: icmp,        destino: 9.9.9.9 }

# ---------- Intranet (CT 224) y extranet (CT 230, DMZ) ----------
ip_intranet: 10.10.20.14
ip_extranet: 10.10.30.10
