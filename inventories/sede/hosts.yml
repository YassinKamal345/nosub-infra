# Máquinas de la sede. Las que aún no existen están comentadas: se activan
# cuando su rol esté listo (ver docs/plan.md).
all:
  children:
    proxmox:
      hosts:
        prx:
          ansible_host: 192.168.1.210   # en el laboratorio; en la centralita cambiará
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa   # clave propia de Proxmox (mientras el nodo de control sea prx)
          node_exporter_ip: 10.10.10.2                   # métricas solo por la red de gestión, nunca por la de la oficina
    gestion:               # VLAN 10
      hosts:
        gns3:        { ansible_host: 10.10.10.20, ansible_user: root }   # GNS3: ensayo de la red física (Ubuntu Server, VM)
    servidores:            # VLAN 20
      hosts:
        gitea:       { ansible_host: 10.10.20.10, ansible_user: root }   # Gitea + nodo de control Ansible (Debian)
        red-int:     { ansible_host: 10.10.20.11, ansible_user: root }   # Bind9 + Kea DHCP + Squid (Debian)
        bbdd:        { ansible_host: 10.10.20.12, ansible_user: root }   # PostgreSQL (Rocky Linux)
        monitor:     { ansible_host: 10.10.20.13, ansible_user: root }   # Prometheus + Grafana (Debian)
        intranet:    { ansible_host: 10.10.20.14, ansible_user: root }   # Intranet: Wiki.js + Nextcloud (Debian)
    dmz:                   # VLAN 30
      hosts:
        extranet:    { ansible_host: 10.10.30.10, ansible_user: root }   # Extranet (portal de clientes) y, en la 3.5, Traefik (Debian)
        k3s:         { ansible_host: 10.10.30.20, ansible_user: root }   # Hosting DAM/DAW: k3s (Ubuntu Server, VM)
    cloud:                 # VPS en Internet (Oracle Cloud; en el laboratorio, simulado en prx)
      hosts:
        vps:
          ansible_host: "{{ cloud_ip_publica }}"
          ansible_user: "{{ 'root' if cloud_laboratorio else 'ubuntu' }}"   # en Oracle se entra como ubuntu y se usa sudo
          ansible_become: true
          node_exporter_ip: "{{ cloud_enlace_ip_vps }}"   # métricas solo por el enlace con la sede
    copias_externas:       # máquinas con datos que se copian cada noche al cloud (rol copias_externas)
      hosts:
        gitea:    { copias_rutas: [/var/lib/gitea, /etc/gitea] }            # repositorios y configuración
        bbdd:     { copias_rutas: [/var/lib/pgsql/copias] }                 # copias diarias de todas las bases
        intranet: { copias_rutas: [/var/lib/nextcloud, /var/www/nextcloud/config] }   # archivos de Nextcloud
