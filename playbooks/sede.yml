# Monta o actualiza toda la sede. Cada fase añade aquí sus roles.
- name: Red del laboratorio (y, si es simulado, el VPS del cloud)
  hosts: proxmox
  gather_facts: true
  roles:
    - red_lab
    - { role: cloud_lab, when: cloud_laboratorio }

# Antes que OPNsense: el VPS deja su clave pública y OPNsense abre el enlace en la misma pasada
- name: VPS del cloud (página de estado, copias externas, entrada de la VPN)
  hosts: cloud
  gather_facts: true
  roles:
    - cloud

- name: Proxmox de la sede
  hosts: proxmox
  gather_facts: true
  roles:
    - opnsense
    - proxmox_vms

- name: Base de datos (PostgreSQL)
  hosts: bbdd
  gather_facts: true
  roles:
    - postgresql

- name: Gitea (repositorio Git de la sede)
  hosts: gitea
  gather_facts: true
  roles:
    - gitea

- name: Red interna (DNS, DHCP y proxy)
  hosts: red-int
  gather_facts: true
  roles:
    - bind9
    - kea_dhcp
    - squid

- name: Intranet (Wiki.js y Nextcloud)
  hosts: intranet
  gather_facts: true
  roles:
    - intranet

- name: Hosting DAM/DAW (k3s, en la DMZ; antes que Traefik, que lo publica)
  hosts: k3s
  gather_facts: true
  roles:
    - k3s

- name: Extranet (portal de clientes y Traefik con HTTPS, en la DMZ)
  hosts: extranet
  gather_facts: true
  roles:
    - extranet
    - traefik

- name: Métricas de todas las máquinas de la sede (node_exporter; las cajas lo llevan en su rol)
  hosts: all:!cajas:!gns3     # GNS3 se enciende a demanda: lo lleva playbooks/gns3.yml
  gather_facts: false
  roles:
    - node_exporter

- name: Acceso SSH solo con clave (también Proxmox)
  hosts: all:!cajas:!gns3
  gather_facts: true
  roles:
    - ssh_seguro

- name: Actualizaciones automáticas de seguridad y registros de 30 días (Proxmox y OPNsense se actualizan a mano, ver docs/contingencia.md)
  hosts: all:!proxmox:!cajas:!gns3
  gather_facts: true
  roles:
    - actualizaciones
    - registros

- name: Copias externas al cloud (restic, por el enlace)
  hosts: copias_externas
  gather_facts: true
  vars:
    copias_clave_latido: "{{ hostvars[groups['cloud'][0]].cloud_tokens.copias }}"
  roles:
    - { role: copias_externas, when: vault_copias is defined }

- name: Monitorización (Prometheus y Grafana)
  hosts: monitor
  gather_facts: true
  roles:
    - monitorizacion
