# Monta o actualiza toda la sede. Cada fase añade aquí sus roles.
- name: Proxmox de la sede
  hosts: proxmox
  gather_facts: true
  roles:
    - red_lab
    - opnsense
    - proxmox_vms

- name: Base de datos (PostgreSQL)
  hosts: bbdd
  gather_facts: true
  roles:
    - postgresql

- name: Gitea (repositorio Git de la sede)
  hosts: gitea
  gather_facts: true
  roles:
    - gitea

- name: Red interna (DNS, DHCP y proxy)
  hosts: red-int
  gather_facts: true
  roles:
    - bind9
    - kea_dhcp
    - squid
