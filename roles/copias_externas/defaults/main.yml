# Copias externas: restic manda cada noche las carpetas de copias_rutas al VPS del cloud (rest-server, rol cloud),
# por el enlace con la sede. Van cifradas (clave en el Vault: vault_copias.clave) y el VPS no deja borrarlas.
copias_restic_version: "0.19.1"
copias_restic_sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c   # linux_amd64
copias_repositorio: "rest:http://{{ cloud_enlace_ip_vps }}:8000/{{ inventory_hostname }}/"
copias_hora: "04:15"                  # después de la copia diaria de PostgreSQL (03:30)
copias_rutas: []                      # cada máquina dice qué guarda (inventories/sede/hosts.yml, grupo copias_externas)
