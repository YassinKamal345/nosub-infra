<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Área de clientes{% endblock %} · {{ empresa }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="barra">
    <a class="marca" href="{{ url_for('panel') }}">{{ empresa }} <span>· Área de clientes</span></a>
    {% if cliente %}
    <form method="post" action="{{ url_for('salir') }}" class="salir">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <span>{{ cliente.nombre }}</span>
      <button type="submit" class="boton secundario">Salir</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% for aviso in get_flashed_messages() %}<p class="aviso">{{ aviso }}</p>{% endfor %}
    {% block contenido %}{% endblock %}
  </main>
  <footer>{{ empresa }}: tu caja, tus datos, sin suscripciones. · <a href="{{ url_for('privacidad') }}">Privacidad</a></footer>
</body>
</html>
