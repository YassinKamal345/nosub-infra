{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1>Entrar</h1>
  <p class="suave">Accede para ver el estado de tu caja y abrir incidencias.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuario <input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña <input name="clave" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="boton">Entrar</button>
  </form>
</section>
{% endblock %}
