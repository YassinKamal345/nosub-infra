# Prometheus (paquete de Debian): cada cuánto recoge datos y cuánto tiempo los guarda
prometheus_intervalo: 15s
prometheus_retencion: 15d

# Avisos al móvil: Alertmanager manda las alertas de Prometheus al canal de ntfy de la página de estado del cloud
# (el mismo al que ya está suscrito el administrador). Solo si el VPS se ha configurado en esta misma ejecución.
alertmanager_activo: "{{ groups['cloud'] | default([]) | length > 0 and hostvars[groups['cloud'][0]].cloud_ntfy_url is defined }}"
alertmanager_repetir: 12h                 # si una alerta sigue activa, se recuerda cada 12 horas
# ntfy convierte el JSON de Alertmanager en un mensaje legible con estas plantillas (Go, no Jinja: !unsafe)
alertmanager_ntfy_titulo: !unsafe 'NoSub: {{if eq .status "resolved"}}resuelto {{end}}{{.commonLabels.alertname}}'
alertmanager_ntfy_mensaje: !unsafe "{{range .alerts}}{{if eq .status \"resolved\"}}✅ {{else}}⚠️ {{end}}{{.annotations.resumen}}\n{{end}}"

# Grafana (repositorio oficial apt.grafana.com; la clave se comprueba por su huella)
grafana_version: "13.3.2"
grafana_clave_huella: B53AE77BADB630A683046005963FA27710458545
grafana_admin: yassin                     # contraseña: vault_grafana.admin_clave
grafana_otros_admins: [edmundo, ramanvir]  # contraseña: vault_grafana.otros_admins.<usuario>
grafana_url: "http://{{ ansible_host }}:3000/"
grafana_dir_paneles: /var/lib/grafana/paneles

# Máquinas que se encienden a demanda (maquinas_virtuales con al_arrancar: false): grupo propio, sin aviso si están apagadas
monitor_a_demanda: "{{ maquinas_virtuales | default([]) | selectattr('al_arrancar', 'defined') | rejectattr('al_arrancar') | map(attribute='nombre') | list }}"
