# ---------- 1. Prometheus y exportadores (paquetes de Debian) ----------
# Sin "recomendados": el paquete de Prometheus trae su propio node_exporter, que chocaría con el del rol node_exporter.
- name: Paquetes
  ansible.builtin.apt:
    name: [prometheus, prometheus-blackbox-exporter, prometheus-postgres-exporter, gnupg]
    install_recommends: false
    update_cache: true
    cache_valid_time: 86400

- name: Prometheus escucha solo en local (lo consulta Grafana) y guarda {{ prometheus_retencion }}
  ansible.builtin.copy:
    dest: /etc/default/prometheus
    content: |
      # Generado por Ansible (nosub-infra, rol monitorizacion)
      ARGS="--web.listen-address=127.0.0.1:9090 --storage.tsdb.retention.time={{ prometheus_retencion }}"
    mode: "0644"
  notify: Reiniciar Prometheus

- name: Avisos (reglas)
  ansible.builtin.template: { src: reglas-nosub.yml.j2, dest: /etc/prometheus/reglas-nosub.yml, mode: "0644", validate: "promtool check rules %s" }
  notify: Reiniciar Prometheus

# ---------- Avisos al móvil: Alertmanager -> ntfy ----------
- name: Alertmanager
  when: alertmanager_activo | bool
  block:
    - name: Paquete de Alertmanager
      ansible.builtin.apt: { name: prometheus-alertmanager, install_recommends: false }
    - name: Alertmanager escucha solo en local y sin clúster
      ansible.builtin.copy:
        dest: /etc/default/prometheus-alertmanager
        content: |
          # Generado por Ansible (nosub-infra, rol monitorizacion)
          ARGS="--web.listen-address=127.0.0.1:9093 --cluster.listen-address="
        mode: "0644"
      notify: Reiniciar Alertmanager
    - name: Dirección del canal de ntfy (es secreta; solo la leen root y Alertmanager)
      ansible.builtin.copy:
        dest: /etc/prometheus/alertmanager-ntfy.url
        content: "{{ hostvars[groups['cloud'][0]].cloud_ntfy_url }}?{{ {'tpl': 'yes', 'p': '4', 't': alertmanager_ntfy_titulo, 'm': alertmanager_ntfy_mensaje} | urlencode }}\n"
        owner: root
        group: prometheus
        mode: "0640"
      no_log: true
      notify: Reiniciar Alertmanager
    - name: A quién avisa y cada cuánto
      ansible.builtin.template: { src: alertmanager.yml.j2, dest: /etc/prometheus/alertmanager.yml, mode: "0644", validate: "amtool check-config %s" }
      notify: Reiniciar Alertmanager
    - name: Arrancar Alertmanager
      ansible.builtin.systemd: { name: prometheus-alertmanager, state: started, enabled: true }

- name: Qué recoge Prometheus
  ansible.builtin.template: { src: prometheus.yml.j2, dest: /etc/prometheus/prometheus.yml, mode: "0644", validate: "promtool check config --syntax-only %s" }
  notify: Reiniciar Prometheus

- name: Certificado público de NoSub CA (para comprobar los certificados de la sede)
  ansible.builtin.copy: { src: "{{ inventory_dir }}/ca/nosub-ca.crt", dest: /etc/prometheus/nosub-ca.crt, mode: "0644" }
  notify: Reiniciar blackbox

- name: Comprobaciones de blackbox
  ansible.builtin.template: { src: blackbox.yml.j2, dest: /etc/prometheus/blackbox.yml, mode: "0644", validate: "prometheus-blackbox-exporter --config.check --config.file=%s" }
  notify: Reiniciar blackbox

- name: blackbox escucha solo en local
  ansible.builtin.copy:
    dest: /etc/default/prometheus-blackbox-exporter
    content: |
      # Generado por Ansible (nosub-infra, rol monitorizacion)
      ARGS="--config.file=/etc/prometheus/blackbox.yml --web.listen-address=127.0.0.1:9115"
    mode: "0644"
  notify: Reiniciar blackbox

# En un contenedor sin privilegios no se pueden abrir sockets ICMP "crudos"; se permite el ping sin
# privilegios del kernel (lo normal en Debian fuera de LXC) y blackbox lo usa solo.
# El rango de grupos tiene que estar dentro de los del contenedor (0-65535).
- name: Ping sin privilegios para la monitorización
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-ping.conf
    content: |
      # Generado por Ansible (nosub-infra, rol monitorizacion)
      net.ipv4.ping_group_range = 0 65535
    mode: "0644"
  register: ping_sysctl

- name: Aplicarlo ya
  when: ping_sysctl is changed
  ansible.builtin.command: sysctl -p /etc/sysctl.d/60-ping.conf
  notify: Reiniciar blackbox

- name: postgres_exporter (lee las estadísticas de PostgreSQL; lleva la contraseña)
  ansible.builtin.copy:
    dest: /etc/default/prometheus-postgres-exporter
    content: |
      # Generado por Ansible (nosub-infra, rol monitorizacion)
      DATA_SOURCE_NAME="postgresql://{{ postgresql_monitor.usuario }}:{{ vault_postgresql[postgresql_monitor.usuario] | urlencode }}@{{ ip_bbdd }}:5432/postgres?sslmode=disable"
      ARGS="--web.listen-address=127.0.0.1:9187"
    owner: root
    group: prometheus
    mode: "0640"
  no_log: true
  notify: Reiniciar postgres_exporter

- name: Arrancar Prometheus y los exportadores
  ansible.builtin.systemd: { name: "{{ item }}", state: started, enabled: true }
  loop: [prometheus, prometheus-blackbox-exporter, prometheus-postgres-exporter]

# ---------- 2. Grafana (repositorio oficial) ----------
- name: Carpeta de claves de apt
  ansible.builtin.file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }

- name: Clave del repositorio de Grafana
  ansible.builtin.get_url: { url: https://apt.grafana.com/gpg.key, dest: /etc/apt/keyrings/grafana.asc, mode: "0644" }

- name: Comprobar que la clave es la de Grafana Labs (por su huella)
  ansible.builtin.shell: gpg --show-keys --with-colons /etc/apt/keyrings/grafana.asc | grep -q '^fpr:::::::::{{ grafana_clave_huella }}:'
  changed_when: false

- name: Repositorio de Grafana
  ansible.builtin.deb822_repository:
    name: grafana
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc

- name: Grafana {{ grafana_version }}
  ansible.builtin.apt: { name: "grafana={{ grafana_version }}", update_cache: true }
  notify: Reiniciar Grafana

- name: Configuración de Grafana (lleva secretos del Vault)
  ansible.builtin.template: { src: grafana.ini.j2, dest: /etc/grafana/grafana.ini, owner: root, group: grafana, mode: "0640" }
  notify: Reiniciar Grafana

- name: Origen de datos (Prometheus) y paneles del repositorio
  ansible.builtin.template: { src: "{{ item.src }}", dest: "/etc/grafana/provisioning/{{ item.dest }}", owner: root, group: grafana, mode: "0640" }
  loop:
    - { src: origenes.yml.j2, dest: datasources/nosub.yml }
    - { src: paneles.yml.j2, dest: dashboards/nosub.yml }
  notify: Reiniciar Grafana

- name: Carpeta de paneles
  ansible.builtin.file: { path: "{{ grafana_dir_paneles }}", state: directory, owner: root, group: grafana, mode: "0750" }

- name: Paneles (Grafana los vuelve a leer solo)
  ansible.builtin.copy: { src: "paneles/{{ item }}", dest: "{{ grafana_dir_paneles }}/{{ item }}", owner: root, group: grafana, mode: "0640" }
  loop: [admin.json, nodos.json]

# Tras un corte de luz, Grafana puede arrancar antes que PostgreSQL: que lo reintente hasta que esté
- name: Carpeta de ajustes del servicio de Grafana
  ansible.builtin.file: { path: /etc/systemd/system/grafana-server.service.d, state: directory, mode: "0755" }

- name: Grafana se reintenta si no llega a la base de datos
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/nosub.conf
    mode: "0644"
    content: |
      # Gestionado por Ansible (nosub-infra/roles/monitorizacion)
      [Unit]
      StartLimitIntervalSec=0
      [Service]
      Restart=always
      RestartSec=10
  notify: Reiniciar Grafana

- name: Arrancar Grafana y que arranque sola
  ansible.builtin.systemd: { name: grafana-server, state: started, enabled: true }

# ---------- Latido hacia la página de estado del cloud (rol cloud) ----------
# La clave la crea el VPS; solo se conoce si el VPS se ha configurado en esta misma ejecución.
- name: Latido hacia la página de estado
  when: groups['cloud'] | default([]) | length > 0 and hostvars[groups['cloud'][0]].cloud_tokens is defined
  vars:
    # Gatus nombra cada aviso "grupo_nombre", en minúsculas y con guiones
    latido_clave_gatus: "{{ ('Sede_' ~ (cloud_latidos | selectattr('clave', 'eq', 'monitorizacion') | map(attribute='nombre') | first)) | lower | regex_replace('[ /,.#+&]', '-') }}"
  block:
    - name: curl para mandar el latido
      ansible.builtin.apt: { name: curl, install_recommends: false }
    - name: Clave del latido (solo la lee root)
      ansible.builtin.copy:
        dest: /etc/nosub-latido.env
        content: "CLAVE={{ hostvars[groups['cloud'][0]].cloud_tokens.monitorizacion }}\n"
        mode: "0600"
      no_log: true
    - name: Script del latido
      ansible.builtin.template: { src: latido.sh.j2, dest: /usr/local/bin/nosub-latido, mode: "0755" }
    - name: Servicio y temporizador del latido (cada minuto)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.f }}"
        mode: "0644"
        content: "{{ item.c }}"
      loop:
        - { f: nosub-latido.service, c: "# Gestionado por Ansible (nosub-infra/roles/monitorizacion)\n[Unit]\nDescription=Latido de la sede a la página de estado del cloud\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/nosub-latido\n" }
        - { f: nosub-latido.timer, c: "# Gestionado por Ansible (nosub-infra/roles/monitorizacion)\n[Unit]\nDescription=Latido de la sede cada minuto\n\n[Timer]\nOnBootSec=1min\nOnUnitActiveSec=1min\n\n[Install]\nWantedBy=timers.target\n" }
      loop_control: { label: "{{ item.f }}" }
    - name: Activar el temporizador
      ansible.builtin.systemd: { name: nosub-latido.timer, state: started, enabled: true, daemon_reload: true }
    - name: Primer latido (comprueba que la página de estado lo acepta)
      ansible.builtin.command: /usr/local/bin/nosub-latido
      changed_when: false
