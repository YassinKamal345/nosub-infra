- name: tar para descomprimir (la plantilla de Rocky no lo trae)
  ansible.builtin.package: { name: tar }

- name: Usuario node_exporter (sin acceso al sistema)
  ansible.builtin.user: { name: node_exporter, system: true, shell: /usr/sbin/nologin, create_home: false }

- name: Descargar node_exporter {{ node_exporter_version }} (comprobando su sha256)
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/usr/local/src/node_exporter-{{ node_exporter_version }}.tar.gz"
    checksum: "sha256:{{ node_exporter_sha256 }}"
    mode: "0644"

- name: Instalar el binario
  ansible.builtin.unarchive:
    src: "/usr/local/src/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, --wildcards, "*/node_exporter"]
    creates: "/usr/local/share/node_exporter-{{ node_exporter_version }}"
  register: binario
  notify: Reiniciar node_exporter

- name: Marcar la versión instalada
  ansible.builtin.copy: { content: "", dest: "/usr/local/share/node_exporter-{{ node_exporter_version }}", mode: "0644", force: false }

- name: Carpeta de métricas en ficheros (textfile)
  ansible.builtin.file: { path: "{{ node_exporter_textfile_dir }}", state: directory, mode: "0755" }

- name: Servicio
  ansible.builtin.template: { src: node_exporter.service.j2, dest: /etc/systemd/system/node_exporter.service, mode: "0644" }
  notify: Reiniciar node_exporter

- name: Arrancar node_exporter y que arranque solo
  ansible.builtin.systemd: { name: node_exporter, state: started, enabled: true, daemon_reload: true }

- name: En Proxmox, dejar entrar solo a la monitorización (firewall de Proxmox)
  when: inventory_hostname in groups['proxmox']
  ansible.builtin.lineinfile:
    path: /etc/pve/firewall/cluster.fw
    insertafter: '^\[RULES\]'
    regexp: '\[nosub\] metricas'
    line: "IN ACCEPT -source {{ ip_monitor }} -p tcp -dport {{ node_exporter_puerto }} -log nolog # [nosub] metricas para la monitorizacion de la sede"
