# Máquina virtual
opnsense_vmid: 200
opnsense_version: "26.7"
opnsense_imagen_sha256: 28d5e2f37e40d87468a924e3006ef10e2ddc6de485b85333d9e3958c84d0cb9d
opnsense_dir_imagen: /var/lib/vz/template/iso/opnsense
opnsense_almacen: local-lvm
opnsense_nucleos: 2
opnsense_ram: 1536
opnsense_disco: 8G
# Arranca la primera al encender Proxmox; las demás esperan a que la red esté lista (tarda unos 45 s)
opnsense_arranque: "order=1,up=45"
opnsense_puente_troncal: vmbr1   # vtnet0: VLANs de la sede
opnsense_puente_wan: vmbr2       # vtnet1: salida a Internet
opnsense_wan_vlan: ""            # en el centro: puente vmbr1 y VLAN 99 (enlace con R1, ver docs/red.md)

# Acceso: gestión (VLAN 10) una vez configurado; de fábrica (192.168.1.1, sin VLAN) solo la primera vez
opnsense_ip_gestion: 10.10.10.1
opnsense_ip_fabrica: 192.168.1.1

# Configuración
opnsense_hostname: fw
opnsense_zona_horaria: Europe/Madrid
opnsense_dns: [9.9.9.9, 1.1.1.1]
opnsense_wan_ip: 172.31.255.2
opnsense_wan_mascara: 30
opnsense_wan_puerta: 172.31.255.1
opnsense_clave_ssh: /root/.ssh/nosub_ansible.pub   # clave del nodo de control (Ansible) que puede entrar por SSH
# Otros nombres con los que se abre la web (p. ej. a través de un proxy inverso)
opnsense_nombres_web: []
# Administradores personales de la web (además de root). Contraseña en el Vault: vault_opnsense_admins.<nombre>
opnsense_administradores:
  - { nombre: yassin, descripcion: "Yassin Kamal" }

# Segundo factor en la web (riesgo RS-07): se entra con la contraseña seguida del código de 6 cifras de la app del
# móvil. Las semillas se derivan de la contraseña de root del Vault (filtro totp_semilla): no hay secretos nuevos y
# sobreviven a una reconstrucción. root también lo lleva y Ansible calcula su código. La consola de Proxmox (serie)
# sigue entrando solo con contraseña: es la puerta de emergencia. QR para la app: scripts/totp-qr.sh <usuario>
opnsense_totp: true
opnsense_totp_servidor: "NoSub TOTP"
opnsense_totp_semillas: "{{ opnsense_root_clave | totp_semillas(['root'] + opnsense_administradores | map(attribute='nombre') | list, 'opnsense-web') }}"

# Interfaz de OPNsense para cada VLAN (la de gestión es "lan")
opnsense_claves_vlan: {10: lan, 20: opt1, 30: opt2, 40: opt3, 50: opt4, 60: opt5}

# Rutas estáticas. Los administradores entran por Tailscale a través de Proxmox (10.10.10.2) con su IP
# real de Tailscale (100.x): así el firewall sabe quién entra (Proxmox no les cambia la dirección).
opnsense_rutas:
  - { red: 100.64.0.0/10, puerta: PROXMOX_TAILSCALE, ip_puerta: 10.10.10.2, interfaz: lan,
      descripcion_puerta: "Proxmox (entrada de Tailscale)", descripcion: "Administradores por Tailscale" }

# Reglas: lo que no está permitido aquí, está bloqueado.
#   lan = GESTION · opt1 = SERVIDORES · opt2 = DMZ · opt3 = EMPLEADOS · opt4 = INVITADOS · opt5 = LAB_CAJAS
#   "(self)" = el propio firewall · redes_privadas = todas las redes internas (para decir "solo Internet")
opnsense_reglas:
  # DNS del firewall para todas las VLANs (hasta que exista Bind9, y como respaldo)
  - { interface: "opt1,opt2,opt3,opt4,opt5,opt6", protocol: TCP/UDP, destination_net: "(self)", destination_port: "53", descripcion: "DNS del firewall" }
  - { interface: "opt1,opt2,opt3,opt4,opt5,opt6", protocol: ICMP, destination_net: "(self)", descripcion: "Ping al firewall" }
  # ADMINISTRADORES por Tailscale (entran por gestión con su IP 100.x): como la red de gestión, a toda la sede
  - { interface: lan, source_net: admins_tailscale, destination_net: redes_privadas, descripcion: "Administradores por Tailscale" }
  # SERVIDORES: a todo menos a la red de gestión
  - { interface: opt1, protocol: UDP, source_net: "{{ opnsense_dhcp_servidor }}", destination_net: "(self)", destination_port: "67", descripcion: "Kea: respuestas al relay DHCP" }
  - { interface: opt1, protocol: TCP, source_net: "{{ ip_monitor }}", destination_net: 10.10.10.2, destination_port: "9100", descripcion: "Monitor: metricas de Proxmox" }
  - { interface: opt1, protocol: TCP, source_net: "{{ ip_monitor }}", destination_net: 10.10.10.20, destination_port: "9100", descripcion: "Monitor: metricas de GNS3" }
  - { interface: opt1, protocol: TCP, source_net: "{{ ip_monitor }}", destination_net: "(self)", destination_port: "443", descripcion: "Monitor: comprobar la web del firewall" }
  # Servidores y VPN no pueden administrar el firewall (web, SSH) a través de su puerta de enlace (10.10.20.1, 10.99.0.1...).
  # Una regla por interfaz: OPNsense pone las de varias interfaces antes que todas las demás, y se saltaría las excepciones de arriba.
  - { interface: opt1, action: block, protocol: TCP, destination_net: "(self)", descripcion: "Servidores: sin acceso a la administracion del firewall" }
  - { interface: opt6, action: block, protocol: TCP, destination_net: "(self)", descripcion: "VPN: sin acceso a la administracion del firewall" }
  # Cajas de los clientes: solo entran en ellas el nodo de control (SSH) y la monitorización (métricas)
  - { interface: opt1, protocol: TCP, source_net: "{{ ip_monitor }}", destination_net: cajas, destination_port: "9100", descripcion: "Monitor: metricas de las cajas" }
  - { interface: opt1, protocol: TCP, source_net: control_ansible, destination_net: cajas, destination_port: "22", descripcion: "Nodo de control: Ansible en las cajas" }
  - { interface: opt1, action: block, destination_net: cajas, descripcion: "Servidores: el resto no entra en las cajas" }
  - { interface: opt1, source_net: opt1, destination_net: lan, destination_not: "1", descripcion: "Servidores: todo menos gestion" }
  # DMZ: solo Internet (las excepciones hacia servidores se añaden con cada servicio)
  - { interface: opt2, protocol: TCP, source_net: "{{ ip_extranet }}", destination_net: "{{ ip_bbdd }}", destination_port: "5432", descripcion: "Extranet: a su base de datos" }
  - { interface: opt2, source_net: opt2, destination_net: redes_privadas, destination_not: "1", descripcion: "DMZ: solo Internet" }
  # EMPLEADOS: servidores (intranet), DMZ (extranet) e Internet
  - { interface: opt3, source_net: opt3, destination_net: opt1, descripcion: "Empleados: a servidores" }
  - { interface: opt3, source_net: opt3, destination_net: opt2, descripcion: "Empleados: a la DMZ" }
  - { interface: opt3, source_net: opt3, destination_net: redes_privadas, destination_not: "1", descripcion: "Empleados: Internet" }
  # INVITADOS: solo Internet, aislada
  - { interface: opt4, source_net: opt4, destination_net: redes_privadas, destination_not: "1", descripcion: "Invitados: solo Internet" }
  # LAB_CAJAS: servidores (despliegue y monitorización) e Internet
  - { interface: opt5, source_net: opt5, destination_net: opt1, descripcion: "Lab cajas: a servidores" }
  - { interface: opt5, source_net: opt5, destination_net: redes_privadas, destination_not: "1", descripcion: "Lab cajas: Internet" }
  # VPN (opt6 = WireGuard): entrada desde Internet y, dentro, como un empleado desde casa
  - { interface: wan, protocol: UDP, destination_net: wanip, destination_port: "{{ opnsense_wg_puerto }}", descripcion: "WireGuard desde Internet" }
  # Las cajas no abren conexiones hacia la sede ni hacia otras cajas: solo responden (el firewall recuerda cada conexión)
  - { interface: opt6, action: block, source_net: cajas, descripcion: "VPN: las cajas no inician conexiones" }
  - { interface: opt6, source_net: opt6, destination_net: opt1, descripcion: "VPN: a servidores" }
  - { interface: opt6, source_net: opt6, destination_net: opt2, descripcion: "VPN: a la DMZ" }
  # CLOUD (opt7 = enlace con el VPS): la entrada de la VPN reenviada por el VPS y lo que comprueba la página de estado
  - { interface: opt7, protocol: UDP, destination_net: "(self)", destination_port: "{{ opnsense_wg_puerto }}", descripcion: "Cloud: entrada de la VPN reenviada por el VPS" }
  - { interface: opt7, protocol: ICMP, source_net: "{{ cloud_enlace_ip_vps }}", destination_net: "(self)", descripcion: "Cloud: la pagina de estado comprueba el enlace" }
  - { interface: opt7, protocol: TCP, source_net: "{{ cloud_enlace_ip_vps }}", destination_net: "{{ ip_extranet }}", destination_port: "443", descripcion: "Cloud: la pagina de estado comprueba el portal" }

# DHCP: OPNsense no reparte IPs; pasa las peticiones de estas VLANs (relay) a Kea, en el CT red-int.
opnsense_dhcp_servidor: "{{ ip_red_int }}"
opnsense_dhcp_vlans: "{{ dhcp_vlans | map(attribute='vlan') | list }}"

# WireGuard (VPN de teletrabajo; en la fase 4, también las cajas). Claves privadas en el Vault (vault_wg_privadas).
opnsense_wg_puerto: 51820
opnsense_wg_red: 10.99.0.0/24
opnsense_wg_ip_servidor: 10.99.0.1/24
opnsense_wg_endpoint: "{{ vpn_sede_endpoint }}"   # por dónde llegan los usuarios: la WAN o el VPS (vpn_entrada)
opnsense_wg_usuarios:
  - { nombre: teletrabajo-prueba, ip: 10.99.0.10 }
# Cajas de los clientes (inventories/cajas): su clave pública la deja caja_nueva.yml en inventories/cajas/wireguard/<caja>.pub.
# Una caja sin ese fichero todavía no tiene túnel.
opnsense_wg_cajas: >-
  {%- set l = [] -%}
  {%- for h in groups['cajas'] | default([]) -%}
  {%- set f = playbook_dir ~ '/../inventories/cajas/wireguard/' ~ h ~ '.pub' -%}
  {%- if f is file -%}{%- set _ = l.append({'nombre': h, 'ip': hostvars[h].ip_vpn, 'publica': lookup('ansible.builtin.file', f) | trim}) -%}{%- endif -%}
  {%- endfor -%}
  {{ l }}
# Enlace con el VPS del cloud (rol cloud): lo abre OPNsense (instancia wg1, interfaz CLOUD = opt7).
# Solo existe cuando el VPS ya ha dejado su clave pública en inventories/sede/cloud/vps.pub.
# La clave de OPNsense para el enlace se deriva de la del servidor (no hay que guardar otro secreto).
opnsense_wg_enlaces: >-
  {%- set f = playbook_dir ~ '/../inventories/sede/cloud/vps.pub' -%}
  {%- if groups['cloud'] | default([]) | length > 0 and f is file -%}
  {{ [{'nombre': 'cloud', 'clave': 'enlace-cloud', 'instancia': '1', 'interfaz': 'opt7', 'descr': 'CLOUD',
       'ip': cloud_enlace_ip_sede ~ '/' ~ (cloud_enlace_red | ansible.utils.ipaddr('prefix')), 'puerto': '51822',
       'remoto': {'nombre': 'vps', 'publica': lookup('ansible.builtin.file', f) | trim, 'endpoint': cloud_ip_publica,
                  'puerto': cloud_enlace_puerto | string, 'permitidas': cloud_enlace_ip_vps ~ '/32'}}] }}
  {%- else -%}[]{%- endif -%}
opnsense_wg_claves_enlaces: "{{ {'enlace-cloud': vault_wg_privadas['servidor'] | wg_derivar('enlace-cloud')} }}"
opnsense_wg_carpeta_confs: /root/nosub-wireguard   # .conf de cada usuario (fuera del repositorio: llevan su clave privada)
