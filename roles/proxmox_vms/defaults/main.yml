# Conexión con la API de Proxmox (el rol se ejecuta en el propio Proxmox)
pve_api_host: 127.0.0.1
pve_nodo: "{{ ansible_hostname }}"

# Usuario propio para Ansible, con solo los permisos que necesita (no root)
pve_usuario: ansible@pve
pve_rol: NoSubAnsible
pve_privilegios:
  - VM.Allocate
  - VM.Audit
  - VM.Config.CPU
  - VM.Config.Disk
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.PowerMgmt
  - Datastore.AllocateSpace
  - Datastore.Audit
  - SDN.Use
  - Sys.Audit
pve_token: nosub
pve_token_fichero: /root/.nosub-pve-token   # el secreto del token vive aquí (0600), nunca en el repositorio

# Plantillas de sistema (se descargan con pveam si faltan)
pve_plantillas:
  debian: debian-13-standard_13.6-1_amd64.tar.zst
  ubuntu: ubuntu-24.04-standard_24.04-2_amd64.tar.zst
  rocky: rockylinux-10-default_20251001_amd64.tar.xz

# Valores por defecto de cada contenedor (cada uno puede cambiarlos)
ct_defecto:
  so: debian
  nucleos: 1
  ram: 512
  swap: 256
  disco: 8
  almacen: local-lvm
  puente: vmbr1
  arranque: 2      # después de OPNsense (orden 1)

ct_clave_ssh: /root/.ssh/nosub_ansible.pub   # clave del nodo de control
ct_zona_horaria: Europe/Madrid

# ---------- Máquinas virtuales (lista "maquinas_virtuales") ----------
# Imagen "cloud" oficial de cada distribución (fecha fija, comprobada con su sha256)
vm_imagenes:
  ubuntu:
    url: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
    sha256: 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
    fichero: ubuntu-24.04-server-cloudimg-amd64-20261017.qcow2
vm_dir_imagenes: /var/lib/vz/template/iso/cloud
vm_snippets: local                  # almacén de Proxmox donde van los ficheros extra de cloud-init
vm_dir_snippets: /var/lib/vz/snippets

# Valores por defecto de cada VM (cada una puede cambiarlos)
vm_defecto:
  so: ubuntu
  nucleos: 2
  ram: 2048
  disco: 20
  almacen: local-lvm
  puente: vmbr1
  arranque: 2
