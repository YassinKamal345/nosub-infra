# Red local donde está conectado Proxmox (la sede nunca entra aquí)
red_local: 192.168.1.0/24
interfaz_salida: vmbr0
# Troncal de la sede (sin tarjeta física en el laboratorio; en la sede real, p. ej. "nic1")
troncal_puerto: none
# Enlace Proxmox <-> OPNsense
wan_lab_prx: 172.31.255.1/30
wan_lab_red: 172.31.255.0/30
wan_lab_opnsense: 172.31.255.2
red_sede: 10.10.0.0/16
# Proxmox dentro de la VLAN de gestión (desde aquí se administra la sede)
vlan_gestion: 10
ip_gestion_prx: 10.10.10.2/24
ip_gestion_opnsense: 10.10.10.1
# Redes de la sede que Proxmox anuncia en Tailscale (acceso remoto de administración).
# Gestión (firewall, Proxmox), servidores (Gitea, Grafana...) y DMZ (portal por HTTPS); nunca la red local (en el laboratorio es la de la oficina). Vacío = no anunciar.
# Hay que aprobar la ruta una vez en la consola de Tailscale (Machines -> prx -> Edit route settings).
tailscale_rutas: [10.10.10.0/24, 10.10.20.0/24, 10.10.30.0/24]

# Casas simuladas de los clientes (solo laboratorio): un bridge por caja que tenga "lab" en inventories/cajas.
# Proxmox hace de router de casa: NAT a Internet y llegada a la sede solo por su WAN (como una IP pública).
# No ven la oficina, ni la sede por dentro, ni las otras casas. En la realidad, esto es el router del cliente.
casas_lab: >-
  {%- set l = [] -%}
  {%- for h in groups['cajas'] | default([]) if hostvars[h].lab is defined -%}
  {%- set _ = l.append({'caja': h, 'puente': hostvars[h].lab.puente_casa, 'red': hostvars[h].red_casa}) -%}
  {%- endfor -%}
  {{ l }}
casas_patron_puentes: vmbr8+          # todos los bridges de casas se llaman vmbr8N
casas_script_cortafuegos: /usr/local/sbin/nosub-casas-cortafuegos

# "Internet" simulado (solo laboratorio, con cloud_laboratorio): donde está el VPS de prueba.
# Llega a Internet (NAT) y a la WAN de la sede; no ve la oficina, ni la sede por dentro, ni las casas.
internet_lab_puente: vmbr90
internet_lab_red: 203.0.113.0/24
