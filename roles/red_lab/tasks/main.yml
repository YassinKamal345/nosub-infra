- name: Activar el reenvío de paquetes (Proxmox hace de router para la WAN de OPNsense)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-nosub-red-lab.conf
    content: "net.ipv4.ip_forward = 1\n"
    mode: "0644"
  notify: Aplicar sysctl

- name: Bridges vmbr1 (troncal) y vmbr2 (WAN de OPNsense)
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} NOSUB red_lab (gestionado por Ansible)"
    block: "{{ lookup('ansible.builtin.template', 'interfaces.j2') }}"
    insertbefore: "^source /etc/network/interfaces.d"
    backup: true
  notify: Recargar red

- name: Aplicar ya los cambios de red (los siguientes roles los necesitan)
  ansible.builtin.meta: flush_handlers

- name: ¿Está Tailscale instalado?
  ansible.builtin.stat: { path: /usr/bin/tailscale }
  register: ts_bin

- name: Rutas que anuncia ahora Tailscale
  when: ts_bin.stat.exists
  ansible.builtin.shell: tailscale debug prefs | python3 -c 'import json,sys;print(",".join(sorted(json.load(sys.stdin).get("AdvertiseRoutes") or [])))'
  register: ts_rutas
  changed_when: false
  check_mode: false

- name: Anunciar la red de gestión de la sede en Tailscale
  when: ts_bin.stat.exists and ts_rutas.stdout != (tailscale_rutas | sort | join(','))
  ansible.builtin.command: tailscale set --advertise-routes={{ tailscale_rutas | join(',') }}
  changed_when: true
