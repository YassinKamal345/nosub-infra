# Traefik: proxy inverso con HTTPS en la DMZ (binario oficial de GitHub, comprobado con su sha256)
traefik_version: "3.7.16"
traefik_sha256: 759a7bc0d66b74c588255ed9e41c7f9d4aba60bdb7bce9dde551b1268a55eb07
traefik_usuario: traefik
traefik_dir_config: /etc/traefik
traefik_puerto_metricas: 8082        # métricas para Prometheus y /ping (solo lo usa la monitorización)

# Webs que publica Traefik: nombres → dirección interna. Cada nombre va en el certificado.
# "prueba": nombre con el que se comprueba la web al acabar (si el primero es un comodín).
traefik_sitios:
  - { nombre: portal, nombres: ["portal.{{ dominio_interno }}"], destino: "http://127.0.0.1:{{ extranet_puerto | default(8080) }}", salud: /salud,
      limitar: { ruta: /entrar, por_minuto: 10 } }   # inicio de sesión: máximo 10 intentos por minuto y por IP
  # Proyectos DAM/DAW: <proyecto>.apps.nosub.lan → Traefik de k3s, que elige el proyecto por el nombre (rol k3s)
  - { nombre: apps, nombres: ["*.apps.{{ dominio_interno }}"], destino: "http://{{ ip_k3s }}", prueba: "demo.apps.{{ dominio_interno }}" }

# Certificado: lo firma la autoridad propia "NoSub CA" (inventories/sede/ca/nosub-ca.crt; clave en vault_ca.clave).
# En la sede real, con dominio público, se cambiaría por Let's Encrypt.
traefik_cert_dias: 397               # lo máximo que aceptan los navegadores
traefik_cert_renovar: "+30d"         # se renueva solo si caduca en menos de 30 días
